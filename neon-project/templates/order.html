<!DOCTYPE html>

<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ title }}</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark"> 
	<div class="container"> 
		<a class="navbar-brand" href="/product_site">
			My Shop 
		</a> 
		<span class="navbar-text text-white"> 
			My Orders
		</span> 
	<div id="user-area"></div>
	</div> 
</nav> 

<script> 
	const userId = localStorage.getItem("user_id");
	const userArea = document.getElementById("user-area"); 
	if (userId !== null) { 
	// Utente loggato 
	userArea.innerHTML = ` 
	<span class="navbar-text text-white">
	User ${userId} 
	</span>
	`; 
	} else { 
	// Utente non loggato 
	userArea.innerHTML = ` <a class="navbar-brand" href="{{"login_site"}}"> 
	Login
	</a> 
	`; }
</script>

<!-- Main content -->
<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="mb-1">Orders</h1>
            <p class="text-muted mb-0">
                View all your orders
            </p>
        </div>

        <button
            id="refresh-button"
            data-testid="refresh-orders"
            class="btn btn-outline-primary"
            type="button">
            Refresh
        </button>

    </div>


    <!-- Loading -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">
                Loading...
            </span>
        </div>

        <p class="mt-3 text-muted">
            Loading orders...
        </p>
    </div>

	<!--Error Login-->
	<div id="login-error" class="alert alert-danger d-none" role="alert" data-testid="orders-error">
        Not logged yet.
    </div>

    <!-- Error -->
    <div id="error" class="alert alert-danger d-none" role="alert" data-testid="orders-error">
        Unable to load orders.
    </div>


    <!-- Orders -->
    <div id="orders" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" data-testid="orders-container">
    </div>


    <!-- No orders -->
    <div id="no-orders" class="alert alert-info d-none" role="alert">
        No orders found.
    </div>


    <!-- Pagination -->
    <nav
        class="mt-5"
        aria-label="orders pagination">

        <ul
            id="pagination"
            class="pagination justify-content-center"
            data-testid="pagination">
        </ul>

    </nav>

</main>


<!-- Footer -->
<footer class="bg-dark text-white py-4 mt-5">

    <div class="container text-center">
        <small>
            My Shop &copy; 2026
        </small>
    </div>

</footer>


<script>

let currentPage = 1;
	async function loadOrders(page = 1) {
		const ordersContainer =document.getElementById("orders");

        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const errorLogin = document.getElementById("login-error"); 
		const noOrders = document.getElementById("no-orders");

        ordersContainer.innerHTML = "";

        loading.classList.remove("d-none");
        error.classList.add("d-none");
        noOrders.classList.add("d-none");
		errorLogin.classList.add("d-none");
		
		let userId= localStorage.getItem("user_id")
		if( userId == null ){
			errorLogin.classList.remove("d-none");
		}else{
	
			try {
				const response = await fetch(
					`/orders/get_orders_by_100?page=${page}&user_id=${userId}`
				);

				if (!response.ok) {
					throw new Error(
						`HTTP error: ${response.status}`
					);
				}

				const orders = await response.json();

				currentPage = page;

				if (orders.length === 0) {
					noOrders.classList.remove("d-none");
				} else {
					displayOrders(orders);
				}
				displayPagination(orders);

			} catch (err) {

				console.error(err);
				error.classList.remove("d-none");
			} finally {
				loading.classList.add("d-none");
			}
		
		}
    }


function displayOrders(orders) {
	const container = document.getElementById("orders");

	container.innerHTML = "";

    orders.forEach(order => {
		const col = document.createElement("div");
		
		col.className = "col";

		col.innerHTML = `
			<div class="card h-100 shadow-sm" data-testid="order-${order.id}">
				<div class="card-body d-flex flex-column">
					
                        <p class="card-text text-muted">
                            Order ID: ${order.id}
                        </p>
                        <div class="mt-auto">
                            <p class="fs-5 fw-bold text-primary">
                                Date: ${order.created_at}
                            </p>

                            <button
                                type="button"
                                class="btn btn-primary w-100"
                                data-testid="click-to-view-${order.id}"
                                onclick="viewOrder(${order.id})">
                                Click to view details
                            </button>

                        </div>

                    </div>

                </div>

            `;


            container.appendChild(col);

        });

    }


function displayPagination(orders) {

        const pagination = document.getElementById("pagination");
		
        pagination.innerHTML = "";


        /*
         * Previous
         */

        const previousLi =
            document.createElement("li");

        previousLi.className =
            `page-item ${
                currentPage === 1 ? "disabled" : ""
            }`;


        previousLi.innerHTML = `

            <button
                class="page-link"
                data-testid="previous-page"
                type="button"
                ${
                    currentPage === 1
                        ? "disabled"
                        : ""
                }>
                Previous
            </button>

        `;


        previousLi
            .querySelector("button")
            .addEventListener("click", () => {

                if (currentPage > 1) {
                    loadOrders(currentPage - 1);
                }

            });


        pagination.appendChild(previousLi);


        /*
         * Current page
         */

        const currentLi =
            document.createElement("li");

        currentLi.className = "page-item active";


        currentLi.innerHTML = `

            <button
                class="page-link"
                data-testid="current-page"
                type="button">
                ${currentPage}
            </button>

        `;


        pagination.appendChild(currentLi);


        if (orders.length === 100) {

            const nextLi = document.createElement("li");

            nextLi.className = "page-item";

            nextLi.innerHTML = `

                <button class="page-link" data-testid="next-page" type="button">
                    Next
                </button>

            `;


            nextLi.querySelector("button").addEventListener("click", () => {

                    loadOrders(currentPage + 1);

                });


            pagination.appendChild(nextLi);

        }

    }


    

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;

    }


    document
        .getElementById("refresh-button")
        .addEventListener("click", () => {

            loadOrders(currentPage);

        });

    loadOrders(1);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/javascript/order.js"></script>
</body>

</html>
