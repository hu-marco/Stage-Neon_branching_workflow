<!DOCTYPE html>

<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ title }}</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark"> 
	<div class="container"> 
		<a class="navbar-brand" href="/product_site">
			My Shop 
		</a> 
		<span class="navbar-text text-white"> 
			Login 
		</span> 
	<div id="user-area"></div>
	</div> 
</nav> 
<script> 
	const userId = localStorage.getItem("user_id");
	const userArea = document.getElementById("user-area"); 
	if (userId !== null) { 
	// Utente loggato 
	userArea.innerHTML = ` 
	<span class="navbar-text text-white">
	User ${userId} 
	</span>
	`; 
	} else { 
	// Utente non loggato 
	userArea.innerHTML = ` <a class="navbar-brand" href="{{"login_site"}}"> 
	Login
	</a> 
	`; }
</script>

<!-- Main content -->
<main class="container py-5">

    
       



    <!-- Error -->
    <div id="error" class="alert alert-danger d-none" role="alert" data-testid="login-error">
        Error Login
    </div>

	<div class="d-flex justify-content-between  my-auto align-items-center mb-4">

		<div id="login" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" data-testid="login-container">
			<form onsubmit="login(event)">
				<input id="email">
				<button id="login_button" class="btn btn-primary w-100"  type="submit" >Sign in</button>
			</form>
		</div>
    </div>



</main>


<!-- Footer -->
<footer class="bg-dark text-white py-4 mt-5">

    <div class="container text-center">
        <small>
            My Shop &copy; 2026
        </small>
    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>
<script src="/static/javascript/login.js"></script>
</body>

</html>
