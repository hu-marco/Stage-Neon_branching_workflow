<!DOCTYPE html>

<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ title }}</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark"> 
	<div class="container"> 
		<a class="navbar-brand" href="/product_site">
			My Shop 
		</a> 
		<span class="navbar-text text-white"> 
			My List
		</span> 
	<div id="user-area"></div>
	</div> 
</nav> 

<script> 
	const userId = localStorage.getItem("user_id");
	const userArea = document.getElementById("user-area"); 
	if (userId !== null) { 
	// Utente loggato 
	userArea.innerHTML = ` 
	<span class="navbar-text text-white">
	User ${userId} 
	</span>
	`; 
	} else { 
	// Utente non loggato 
	userArea.innerHTML = ` <a class="navbar-brand" href="{{"login_site"}}"> 
	Login
	</a> 
	`; }
</script>

<!-- Main content -->
<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="mb-1">Order Item</h1>
            <p class="text-muted mb-0">
                View all your product
            </p>
        </div>

        <button
            id="refresh-button"
            data-testid="refresh-order_items"
            class="btn btn-outline-primary"
            type="button">
            Refresh
        </button>

    </div>


    <!-- Loading -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">
                Loading...
            </span>
        </div>

        <p class="mt-3 text-muted">
            Loading order item...
        </p>
    </div>

	<!--Error Order-->
	<div id="order-error" class="alert alert-danger d-none" role="alert" data-testid="order_item-error">
        Not order selected
    </div>

    <!-- Error -->
    <div id="error" class="alert alert-danger d-none" role="alert" data-testid="orders_items-error">
        Unable to load order items.
    </div>


    <!-- Order Items -->
    <div id="order_items" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" data-testid="order_items-container">
    </div>


	<!-- Additional content-->
	
	<div id="additional">

    <!-- Coupon -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <form onsubmit="applyCoupon(event)">
            <input id="coupon_id" type="text" placeholder="Coupon">
            <button class="btn btn-primary" type="submit">
                Apply Coupon
            </button>
        </form>
    </div>
	
	<!-- Calculate Total -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <form onsubmit="calculateTotal(event)">
            
            <button class="btn btn-primary" type="submit">
                Calculate Total
            </button>
        </form>
    </div>
	
    <!-- Fet Total -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <form onsubmit="getTotal(event)">
            <p id="total"></p>

            <button class="btn btn-primary" type="submit">
                Get total
            </button>
        </form>
    </div>

</div>

    <!-- No orders -->
    <div id="no-order_item" class="alert alert-info d-none" role="alert">
        No item found.
    </div>

    <!-- Pagination -->
    <nav
        class="mt-5"
        aria-label="order_item pagination">

        <ul
            id="pagination"
            class="pagination justify-content-center"
            data-testid="pagination">
        </ul>

    </nav>

</main>


<!-- Footer -->
<footer class="bg-dark text-white py-4 mt-5">

    <div class="container text-center">
        <small>
            My Shop &copy; 2026
        </small>
    </div>

</footer>


<script>

let currentPage = 1;
	async function loadOrderItems(page = 1) {
	
		const orderItemContainer =document.getElementById("order_items");

        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const errorOrder = document.getElementById("order-error"); 
		const noOrderItems = document.getElementById("no-order_item");
		const additional = document.getElementById("additional");
        orderItemContainer.innerHTML = "";

        loading.classList.remove("d-none");
        error.classList.add("d-none");
        noOrderItems.classList.add("d-none");
		errorOrder.classList.add("d-none");
		additional.classList.add("d-none");
		
		let orderId= localStorage.getItem("viewed_order_id")
		if( orderId == null ){
			errorOrder.classList.remove("d-none");
		}else{
	
			try {
				const response = await fetch(
					`/order_items/get_order_items_by_100?page=${page}&order_id=${orderId}`
				);

				if (!response.ok) {
					throw new Error(
						`HTTP error: ${response.status}`
					);
				}

				const order_items = await response.json();

				currentPage = page;

				if (order_items.length === 0) {
					noOrderItems.classList.remove("d-none");
				} else {
					displayOrderItems(order_items);
				}
				displayPagination(order_items);

			} catch (err) {

				console.error(err);
				error.classList.remove("d-none");
			} finally {
				loading.classList.add("d-none");
			}
		
		}
    }


function displayOrderItems(order_items) {
	const container = document.getElementById("order_items");
	let additional = document.getElementById("additional");
	additional.classList.remove("d-none");
	container.innerHTML = "";

    order_items.forEach(order_item => {
		const col = document.createElement("div");
		
		col.className = "col";

		col.innerHTML = `
			<div class="card h-100 shadow-sm" data-testid="order_item-${order_item.id}">
				<div class="card-body d-flex flex-column">
					
                        <p class="card-text text-muted">
                            Order Item ID: ${order_item.id}
                        </p>
                        <div class="mt-auto">
                            <p class="fs-5 fw-bold text-primary">
                                Product Id: ${order_item.product_id}

                            </p>
                            <p class="fs-5 fw-bold text-primary">
								Quantity: ${order_item.quantity}

                            </p>

                        </div>

                    </div>

                </div>

            `;


            container.appendChild(col);

        });

    }


function displayPagination(order_items) {

        const pagination = document.getElementById("pagination");
		
        pagination.innerHTML = "";


        /*
         * Previous
         */

        const previousLi =
            document.createElement("li");

        previousLi.className =
            `page-item ${
                currentPage === 1 ? "disabled" : ""
            }`;


        previousLi.innerHTML = `

            <button class="page-link" data-testid="previous-page" type="button"
                ${
                    currentPage === 1
                        ? "disabled"
                        : ""
                }>
                Previous
            </button>

        `;


        previousLi
            .querySelector("button")
            .addEventListener("click", () => {

                if (currentPage > 1) {
                    loadOrderItems(currentPage - 1);
                }

            });


        pagination.appendChild(previousLi);


        /*
         * Current page
         */

        const currentLi =
            document.createElement("li");

        currentLi.className = "page-item active";


        currentLi.innerHTML = `

            <button
                class="page-link"
                data-testid="current-page"
                type="button">
                ${currentPage}
            </button>

        `;


        pagination.appendChild(currentLi);


        if (order_items.length === 100) {

            const nextLi = document.createElement("li");

            nextLi.className = "page-item";

            nextLi.innerHTML = `

                <button class="page-link" data-testid="next-page" type="button">
                    Next
                </button>

            `;


            nextLi.querySelector("button").addEventListener("click", () => {

                    loadOrderItems(currentPage + 1);

                });


            pagination.appendChild(nextLi);

        }

    }


    

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;

    }


    document
        .getElementById("refresh-button")
        .addEventListener("click", () => {

            loadOrderItems(currentPage);

        });

    loadOrderItems(1);

</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/javascript/order_item.js"></script>
</body>

</html>
