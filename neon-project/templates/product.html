<!DOCTYPE html>

<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ title }}</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark"> 
	<div class="container"> 
		<a class="navbar-brand" href="/product_site">
			My Shop 
		</a>
		<a class="navbar-brand" href="/order_site">
			My Orders 
		</a> 
		<span class="navbar-text text-white"> 
			Products 
		</span> 
	<div id="user-area"></div>
	</div> 
</nav> 
<form onsubmit="createOrder(event)">
 <button class="btn btn-primary w-100" type="submit"> 
	Create order
 </button>
</form>
<script> 
	const userId = localStorage.getItem("user_id");
	const userArea = document.getElementById("user-area"); 
	if (userId !== null) { 
	// User Logge 
	userArea.innerHTML = ` 
	<span class="navbar-text text-white">
	User ${userId} 
	</span>
	`; 
	} else { 
	// Utente non loggato 
	userArea.innerHTML = ` <a class="navbar-brand" href="{{"login_site"}}"> 
	Login
	</a> 
	`; }
</script>

<!-- Main content -->
<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1 class="mb-1">Products</h1>
            <p class="text-muted mb-0">
                Browse our products
            </p>
        </div>

        <button
            id="refresh-button"
            data-testid="refresh-products"
            class="btn btn-outline-primary"
            type="button">
            Refresh
        </button>

    </div>


    <!-- Loading -->
    <div
        id="loading"
        class="text-center py-5">
        <div
            class="spinner-border text-primary"
            role="status">
            <span class="visually-hidden">
                Loading...
            </span>
        </div>

        <p class="mt-3 text-muted">
            Loading products...
        </p>
    </div>


    <!-- Error -->
    <div
        id="error"
        class="alert alert-danger d-none"
        role="alert"
        data-testid="products-error">
        Unable to load products.
    </div>


    <!-- Products -->
    <div
        id="products"
        class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"
        data-testid="products-container">
    </div>


    <!-- No products -->
    <div
        id="no-products"
        class="alert alert-info d-none"
        role="alert"
    >
        No products found.
    </div>


    <!-- Pagination -->
    <nav
        class="mt-5"
        aria-label="Products pagination">

        <ul
            id="pagination"
            class="pagination justify-content-center"
            data-testid="pagination">
        </ul>

    </nav>

</main>


<!-- Footer -->
<footer class="bg-dark text-white py-4 mt-5">

    <div class="container text-center">
        <small>
            My Shop &copy; 2026
        </small>
    </div>

</footer>


<script>

let currentPage = 1;
	async function loadProducts(page = 1) {
		const productsContainer =
			document.getElementById("products");

        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const noProducts = document.getElementById("no-products");

        productsContainer.innerHTML = "";

        loading.classList.remove("d-none");
        error.classList.add("d-none");
        noProducts.classList.add("d-none");


        try {
			const response = await fetch(
                `/products/get_products_by_100?page=${page}`
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP error: ${response.status}`
                );
            }

            const products = await response.json();

            currentPage = page;

            if (products.length === 0) {
                noProducts.classList.remove("d-none");
            } else {
                displayProducts(products);
            }

            displayPagination(products);

        } catch (err) {

            console.error(err);

            error.classList.remove("d-none");

        } finally {
            loading.classList.add("d-none");
        }
    }


function displayProducts(products) {
	const container = document.getElementById("products");

	container.innerHTML = "";

    products.forEach(product => {
		const col = document.createElement("div");
		
		col.className = "col";

		col.innerHTML = `
			<div class="card h-100 shadow-sm" data-testid="product-${product.id}">
				<div class="card-body d-flex flex-column">
					<h5 class="card-title">
						${escapeHtml(product.name)}
					</h5>
                        <p class="card-text text-muted">
                            Product ID: ${product.id}
                        </p>
                        <div class="mt-auto">
                            <p class="fs-5 fw-bold text-primary">
                                € ${product.price}
                            </p>
							<div class="quantity-wrapper">
							  <span>Quantity:</span>

								<div class="quantity">
									<input id="quantity-${product.id}" class="form-control" type="number" min="1" max="10" aria-label="Quantity" value="1">
								</div>
							</div>


                            <button
                                type="button"
                                class="btn btn-primary w-100"
                                data-testid="add-to-cart-${product.id}"
                                onclick="addToCart(${product.id})">
                                Add to cart
                            </button>

                        </div>

                    </div>

                </div>

            `;


            container.appendChild(col);

        });

    }


    function displayPagination(products) {

        const pagination =
            document.getElementById("pagination");


        pagination.innerHTML = "";


        /*
         * Previous
         */

        const previousLi =
            document.createElement("li");

        previousLi.className =
            `page-item ${
                currentPage === 1 ? "disabled" : ""
            }`;


        previousLi.innerHTML = `

            <button
                class="page-link"
                data-testid="previous-page"
                type="button"
                ${
                    currentPage === 1
                        ? "disabled"
                        : ""
                }>
                Previous
            </button>

        `;


        previousLi
            .querySelector("button")
            .addEventListener("click", () => {

                if (currentPage > 1) {
                    loadProducts(currentPage - 1);
                }

            });


        pagination.appendChild(previousLi);


        /*
         * Current page
         */

        const currentLi =
            document.createElement("li");

        currentLi.className = "page-item active";


        currentLi.innerHTML = `

            <button
                class="page-link"
                data-testid="current-page"
                type="button">
                ${currentPage}
            </button>

        `;


        pagination.appendChild(currentLi);


        if (products.length === 100) {

            const nextLi =
                document.createElement("li");

            nextLi.className = "page-item";


            nextLi.innerHTML = `

                <button
                    class="page-link"
                    data-testid="next-page"
                    type="button">
                    Next
                </button>

            `;


            nextLi.querySelector("button").addEventListener("click", () => {

                    loadProducts(currentPage + 1);

                });


            pagination.appendChild(nextLi);

        }

    }


    

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;

    }


    document
        .getElementById("refresh-button")
        .addEventListener("click", () => {

            loadProducts(currentPage);

        });

    loadProducts(1);

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/javascript/product.js"></script>
</body>

</html>
