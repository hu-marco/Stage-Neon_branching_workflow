name: coupons table

on:
  pull_request:
    branches: [ "coupons" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_ROLE: ${{ secrets.DATABASE_ROLE }}

      PR_NUMBER: ${{ github.event.pull_request.number || 'local'}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r neon-project/requirements.txt

      - name: Create Neon branch
        working-directory: neon-project
        run: |
          python  setup_branch.py create

      - name: Run database migrations
        working-directory: neon-project
        run: |
          python setup_branch.py migrate 1b6df6316c0e
       
      #- name: Check project
      #  working-directory: neon-project
      #  run: |
      #    pwd
      #    ls -la
      #    python -c "import os; print(os.getcwd())"
      #    python -c "import sys; print(sys.path)"
      #    python -c "import main; print(main.__file__)"

      - name: Run tests
        working-directory: neon-project
        run: |
          python -m pytest tests/coupon_test.py\
            --junitxml=test-results.xml \
            --html=test-report.html \
            --self-contained-html

      - name: Upload test report
        working-directory: neon-project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/test-results.xml
            reports/test-report.html

      - name: Delete Neon branch
        working-directory: neon-project
        if: always()
        run: |
          python setup_branch.py cleanup
